[package]
name = "maker_editor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "maker-studio"
path = "src/main.rs"

[dependencies]
maker_api.workspace = true
maker_engine.workspace = true
maker_render.workspace = true
maker_textura = { path = "../maker_textura" }
rayon = "1"
glam.workspace = true
hecs.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
log.workspace = true
env_logger.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# Selector de archivos nativo (portal XDG en Linux, sin librerías nuevas al compilar).
rfd = "0.17"
# Portapapeles de imágenes, las mismas features que ya usa egui-winit.
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
