[package]
name = "maker_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
maker_api.workspace = true
glam.workspace = true
hecs.workspace = true
rapier3d.workspace = true
gltf.workspace = true
serde.workspace = true
serde_json.workspace = true
libloading.workspace = true
log.workspace = true
bytemuck.workspace = true
# Interfaz: lector de fuentes y fuente por defecto (los mismos que ya compila egui).
skrifa = { version = "0.44", default-features = false, features = ["std", "autohint_shaping"] }
epaint_default_fonts = "0.37"
# Solo para leer el tamaño real de las imágenes de la interfaz (cabecera).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.18"
bevy_mikktspace = "1"
